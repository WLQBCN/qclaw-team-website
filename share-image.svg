<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a0c0c"/>
      <stop offset="50%" style="stop-color:#1a0505"/>
      <stop offset="100%" style="stop-color:#0d0202"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d78c"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#b8941f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="300" fill="url(#bgGrad)"/>

  <!-- 装饰光晕 -->
  <circle cx="60" cy="60" r="80" fill="rgba(212,175,55,0.05)"/>
  <circle cx="240" cy="240" r="60" fill="rgba(212,175,55,0.03)"/>

  <!-- Logo占位符 -->
  <rect x="100" y="30" width="100" height="50" rx="8" fill="rgba(255,255,255,0.1)" stroke="#d4af37" stroke-width="1"/>
  <text x="150" y="60" text-anchor="middle" fill="#d4af37" font-size="14" font-family="Microsoft YaHei, sans-serif">心意内衣</text>

  <!-- 分隔线 -->
  <line x1="100" y1="95" x2="200" y2="95" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- 主题文字 -->
  <text x="150" y="130" text-anchor="middle" fill="url(#goldGrad)" font-size="22" font-family="Microsoft YaHei, sans-serif" font-weight="bold" letter-spacing="4">
    同心同行
  </text>
  <text x="150" y="158" text-anchor="middle" fill="url(#goldGrad)" font-size="22" font-family="Microsoft YaHei, sans-serif" font-weight="bold" letter-spacing="4">
    孝暖初心
  </text>
  <text x="150" y="186" text-anchor="middle" fill="url(#goldGrad)" font-size="22" font-family="Microsoft YaHei, sans-serif" font-weight="bold" letter-spacing="4">
    致敬坚守
  </text>

  <!-- 日期徽章 -->
  <rect x="80" y="205" width="140" height="36" rx="4" fill="url(#goldGrad)"/>
  <text x="150" y="229" text-anchor="middle" fill="#1a0a0a" font-size="16" font-family="Microsoft YaHei, sans-serif" font-weight="bold" letter-spacing="2">
    2026.06.17
  </text>

  <!-- 地点 -->
  <text x="150" y="265" text-anchor="middle" fill="#c9a04a" font-size="13" font-family="Microsoft YaHei, sans-serif" letter-spacing="1">
    建瓯 · 玺苑大酒店
  </text>

  <!-- 底部装饰 -->
  <text x="150" y="290" text-anchor="middle" fill="#8a7a5a" font-size="11" font-family="Microsoft YaHei, sans-serif" letter-spacing="2">
    诚邀您的参与
  </text>
</svg>